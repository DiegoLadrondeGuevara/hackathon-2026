# Red TeleCorp: núcleo en AWS (AWS Academy). Serverless Framework v3.
# Detalle de piezas en infra/: flags.yml, functions.yml, statemachine.yml, resources.yml
service: red-telecorp
frameworkVersion: '3'

plugins:
  - serverless-step-functions

custom:
  prefix: red-telecorp-${self:provider.stage}
  accountId: ${env:AWS_ACCOUNT_ID, aws:accountId}
  labRole: arn:aws:iam::${self:custom.accountId}:role/LabRole
  flags: ${file(infra/flags.yml)}

provider:
  name: aws
  runtime: python3.11
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 7
  iam:
    role: ${self:custom.labRole}   # AWS Academy: no se pueden crear roles, se usa LabRole
  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
        - Idempotency-Key
      allowedMethods:
        - GET
        - POST
        - PATCH
        - OPTIONS
    authorizers:
      jwtAuthorizer:
        type: request
        functionName: autorizarJwt
        payloadVersion: '2.0'
        enableSimpleResponses: true
        resultTtlInSeconds: 300
        identitySource:
          - $request.header.Authorization
  environment:
    STAGE: ${self:provider.stage}
    SSM_PREFIX: /red-telecorp/${self:provider.stage}
    TABLE_REPORTS: ${self:custom.prefix}-Reports
    TABLE_INCIDENTS: ${self:custom.prefix}-Incidents
    TABLE_TELEMETRY: ${self:custom.prefix}-Telemetry
    TABLE_CORRELATION_MEMBERS: ${self:custom.prefix}-CorrelationMembers
    TABLE_NETWORK_CATALOG: ${self:custom.prefix}-NetworkCatalog
    TABLE_CUSTOMER_PROFILES: ${self:custom.prefix}-CustomerProfiles
    TABLE_OUTBOX: ${self:custom.prefix}-Outbox
    EVENT_BUS_NAME: ${self:custom.prefix}-operaciones
    METRICS_BUCKET: ${self:custom.prefix}-metricas-${self:custom.accountId}
    QUEUE_METRICAS_URL: !Ref ColaMetricas
    OPS_TOPIC_ARN: !Ref AlertasOperacionesTopic
    CUSTOMERS_TOPIC_ARN: !Ref NotificacionesClientesTopic
    EMAIL_MODE: ${self:custom.flags.emailMode}
    SMS_MODE: ${self:custom.flags.smsMode}

package:
  patterns:
    - '!**'
    - 'src/**'
    - '!src/**/__pycache__/**'

functions: ${file(infra/functions.yml)}

stepFunctions: ${file(infra/statemachine.yml)}

resources: ${file(infra/resources.yml)}
