# Máquina de estados VerificarIncidente (Standard).
validate: true
stateMachines:
  VerificarIncidente:
    id: VerificarIncidenteMachine
    name: ${self:custom.prefix}-VerificarIncidente
    type: STANDARD
    role: ${self:custom.labRole}
    definition:
      Comment: Verifica evidencias, calcula prioridad y alerta a operaciones
      StartAt: VerificarEvidencias
      States:
        VerificarEvidencias:
          Type: Parallel
          ResultPath: $.evidence
          Branches:
            - StartAt: EvidenciasUsuarios
              States:
                EvidenciasUsuarios:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: ${self:custom.prefix}-VerificadoraDeEvidencias
                    Payload:
                      incident_id.$: $.incident_id
                      mode: users
                  OutputPath: $.Payload
                  Retry:
                    - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                      IntervalSeconds: 2
                      MaxAttempts: 3
                      BackoffRate: 2
                  End: true
            - StartAt: EvidenciasAntenas
              States:
                EvidenciasAntenas:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: ${self:custom.prefix}-VerificadoraDeEvidencias
                    Payload:
                      incident_id.$: $.incident_id
                      mode: antennas
                  OutputPath: $.Payload
                  Retry:
                    - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                      IntervalSeconds: 2
                      MaxAttempts: 3
                      BackoffRate: 2
                  End: true
          Catch:
            - ErrorEquals: [States.ALL]
              ResultPath: $.error
              Next: AlertarFalla
          Next: CalcularPrioridad
        CalcularPrioridad:
          Type: Task
          Resource: arn:aws:states:::lambda:invoke
          Parameters:
            FunctionName: ${self:custom.prefix}-CalculadoraDePrioridad
            Payload:
              incident_id.$: $.incident_id
              evidence.$: $.evidence
          ResultSelector:
            priority.$: $.Payload.priority
            priority_changed.$: $.Payload.priority_changed
            status_changed.$: $.Payload.status_changed
            alert.$: $.Payload.alert
          ResultPath: $.calc
          Retry:
            - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
              IntervalSeconds: 2
              MaxAttempts: 3
              BackoffRate: 2
          Catch:
            - ErrorEquals: [States.ALL]
              ResultPath: $.error
              Next: AlertarFalla
          Next: RequiereAlerta
        RequiereAlerta:
          Type: Choice
          Choices:
            - Variable: $.calc.alert
              BooleanEquals: true
              Next: AlertarOperaciones
          Default: Terminado
        AlertarOperaciones:
          Type: Task
          Resource: arn:aws:states:::lambda:invoke
          Parameters:
            FunctionName: ${self:custom.prefix}-AlertadoraDeOperaciones
            Payload:
              mode: incident
              incident_id.$: $.incident_id
              calc.$: $.calc
          ResultPath: null
          Retry:
            - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
              IntervalSeconds: 2
              MaxAttempts: 3
              BackoffRate: 2
          Next: Terminado
        AlertarFalla:
          Type: Task
          Resource: arn:aws:states:::lambda:invoke
          Parameters:
            FunctionName: ${self:custom.prefix}-AlertadoraDeOperaciones
            Payload:
              mode: failure
              incident_id.$: $.incident_id
              error.$: $.error
          ResultPath: null
          Next: Fallo
        Fallo:
          Type: Fail
          Error: VerificacionFallida
          Cause: Fallo la verificacion del incidente
        Terminado:
          Type: Succeed
