<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    <title>Estado de la red | Red TeleCorp</title>
    <style>
      :root { font: 16px/1.5 system-ui, sans-serif; color: #e9eef6; background: #101827; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header { border-bottom: 1px solid #324052; background: #172336; }
      .wrap { max-width: 960px; margin: auto; padding: 24px; }
      h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.4rem); }
      h2 { margin: 0 0 8px; font-size: 1.2rem; }
      p { margin: 8px 0; }
      .muted { color: #bac9db; }
      #notice { padding: 12px 16px; border-radius: 8px; background: #203148; margin: 20px 0; }
      #notice.error { background: #5b2432; }
      #notice.stale { background: #594222; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
      .card { border: 1px solid #405167; border-radius: 12px; padding: 20px; background: #19283b; }
      .badge { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: .85rem; font-weight: 700; background: #384558; }
      .SIN_INCIDENTE { background: #1c5f48; }
      .EVALUACION { background: #75602a; }
      .CONFIRMADO { background: #7c3440; }
      .RESTABLECIDO { background: #265e78; }
      time { font-variant-numeric: tabular-nums; }
      footer { margin-top: 32px; border-top: 1px solid #324052; }
    </style>
  </head>
  <body>
    <header><div class="wrap"><h1>Estado de la red</h1><p class="muted">Red TeleCorp · Información pública por zona</p></div></header>
    <main class="wrap">
      <p id="notice" role="status" aria-live="polite">Consultando el estado de las zonas…</p>
      <div id="zones" class="grid" aria-live="polite"></div>
    </main>
    <footer><div class="wrap muted">Los estados pueden cambiar mientras se evalúa una incidencia. Actualización automática cada 30 segundos.</div></footer>
    <script src="config.js"></script>
    <script>
      const notice = document.getElementById("notice");
      const zones = document.getElementById("zones");
      const labels = {
        SIN_INCIDENTE: "Sin incidente",
        EVALUACION: "En evaluación",
        CONFIRMADO: "Confirmado",
        RESTABLECIDO: "Restablecido"
      };
      const allowed = new Set(Object.keys(labels));
      const apiBase = (window.RED_TELECORP_API_BASE_URL || "").replace(/\/$/, "");
      const staleAfterMs = 10 * 60 * 1000;

      function field(parent, tag, value, className) {
        const element = document.createElement(tag);
        element.textContent = value;
        if (className) element.className = className;
        parent.appendChild(element);
        return element;
      }

      function render(rows) {
        zones.replaceChildren();
        if (!rows.length) {
          notice.className = "";
          notice.textContent = "Aún no hay estados de zonas publicados.";
          return;
        }
        const ordered = [...rows].sort((a, b) => String(a.zone_id).localeCompare(String(b.zone_id)));
        let stale = false;
        for (const row of ordered) {
          const card = document.createElement("section");
          card.className = "card";
          field(card, "h2", `Zona ${row.zone_id}`);
          field(card, "span", labels[row.status] || "Estado desconocido", `badge ${allowed.has(row.status) ? row.status : ""}`);
          field(card, "p", row.public_message || "Sin información publicada");
          if (row.priority) field(card, "p", `Prioridad: ${row.priority}`, "muted");
          const when = new Date(row.last_synced_at);
          if (Number.isNaN(when.getTime()) || Date.now() - when.getTime() > staleAfterMs) stale = true;
          field(card, "p", `Última sincronización: ${Number.isNaN(when.getTime()) ? "desconocida" : when.toLocaleString("es-PE")}`, "muted");
          zones.appendChild(card);
        }
        notice.className = stale ? "stale" : "";
        notice.textContent = stale
          ? "La última sincronización de una o más zonas está atrasada; el estado mostrado puede no ser actual."
          : `Estados publicados para ${ordered.length} zonas.`;
      }

      async function refresh() {
        if (!apiBase || apiBase.includes("REPLACE_ME")) {
          notice.className = "error";
          notice.textContent = "Falta configurar la URL de la API.";
          return;
        }
        try {
          const result = await fetch(`${apiBase}/api/estado`, { cache: "no-store" });
          if (!result.ok) throw new Error(`HTTP ${result.status}`);
          const data = await result.json();
          if (!Array.isArray(data.zones)) throw new Error("Respuesta inválida");
          render(data.zones);
        } catch (error) {
          notice.className = "error";
          notice.textContent = "No pudimos actualizar los estados. Se conserva la última información mostrada.";
        }
      }

      refresh();
      setInterval(refresh, 30000);
    </script>
  </body>
</html>
